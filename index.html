<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richetti Projects</title>
    <link rel="stylesheet" href="./master.css">
    <link rel="icon" type="image/png" href="">
</head>
<body>
    <h1>Welcome to my website</h1>

    <nav id="nav_bar">
        <a href="">Home</a>
        <a href="">Projects</a>
        <a href="">Contact me</a>
    </nav>

    <div class="website_cover_parent">
        <img id="website_cover" src="/media/page_cover.png" alt="website cover">
    </div>
    
    <section class="contact_me">
        <form action="" method="post">
            <div>
                <div>
                    <label class="required" for="firstname">First Name</label>
                    <input type="text" name="firstname" id="firstname" placeholder="Type first name">
                </div>
                <div> 
                    <label class="required" for="lastname">Last Name</label>
                    <input type="text" name="lastname" id="lastname" placeholder="Type last name">
                </div>
                <div>
                    <label class="required" for="companyname">Company Name</label>
                    <input type="text" name="companyname" id="companyname" placeholder="Type company name">
                </div>
                <div>
                    <label for="myTA">Message:</label>
                    <textarea name="myMessage" id="myTA" cols="40" rows="5"></textarea>
                </div>
                <div class="form_buttons">
                    <input type="reset" name="resetBtn" id="resetBtn" value="RESET FORM">
                    <input type="submit" name="submitBtn" id="submitBtn" value="SUBMIT FORM">
                </div>
            </div>
        </form>
    </section>
    

    <div class="skills_table">
        <table>
            <caption>Just a table with some info</caption>
            <tr>
                <th>Don't know</th>
                <th>Meta phase</th>
                <th>Contributors</th>
                <th>Version</th>
            </tr>
            <tr>
                <td>Testing</td>
                <td>Hello</td>
                <td>Info</td>
                <td>2.0</td>
            </tr>
        </table>
    </div>
    

    

    <footer>
        <small> <sup>&copy;</sup> Giovanni Richetti. All rights reserved.</small>
    </footer>
</body>
</html>
