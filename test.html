<!DOCTYPE html>
<html>
<head>
   <title>JavaScript Demo</title>
   <meta charset="UTF-8">
   <script src="./test.js" defer></script>
   <style>
      body { 
         transition: background-color 0.5s ease, transform 0.5s ease; 
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         height: 100vh;
         margin: 0;
         overflow: hidden;
         }
</style>
</head>
<body>
   <h1>Popup Demo</h1>
   <button id="bgBtn">Background change</button><br>
   <button id="regretBtn">Turn back to normal</button>
   <script>
      const colors = ["lightgreen", "skyblue", "coral", "gold", "plum"];
      let currentIndex = 0;
      let currentRotation= 0;

      let bgBtn = document.getElementById("bgBtn");
      bgBtn.addEventListener("click", function(){
         document.body.style.backgroundColor = colors[currentIndex];
         currentIndex = (currentIndex + 1) % colors.length;

         currentRotation += 90;
         document.body.style.transform = `rotate(${currentRotation}deg)`;
      });

      let regretBtn = document.getElementById("regretBtn");
      regretBtn.addEventListener("click", function(){
         document.body.style.backgroundColor = "white";
         document.body.style.transform = "rotate(0deg)";
         currentRotation = 0;
         currentIndex = 0;
      });

   </script>
</body>
</html>
